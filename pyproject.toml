[project]
name = "apart-judgeops"
version = "0.1.0"
description = "Judge sourcing + LLM grading pipeline for Apart Research hackathons"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.scripts]
judgeops = "app.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
